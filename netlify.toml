[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev:vite -- --host 127.0.0.1"
  targetPort = 5173
  port = 8888
  autoLaunch = false
  framework = "#custom"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
